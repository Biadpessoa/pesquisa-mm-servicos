<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pesquisa MadeiraMadeira Serviços</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #F2EDE6;
    --chat-bg: #FDFAF6;
    --bot-bubble: #FFFFFF;
    --user-bubble: #2D5BE3;
    --user-text: #FFFFFF;
    --bot-text: #1A1A2E;
    --accent: #2D5BE3;
    --accent-light: #EBF0FD;
    --muted: #8A8A9A;
    --border: #E2DDD6;
    --tag-bg: #FFFFFF;
    --tag-selected: #2D5BE3;
    --tag-selected-text: #FFFFFF;
    --progress-bg: #E2DDD6;
    --shadow: 0 2px 16px rgba(45,91,227,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
  }

  /* Header */
  .header {
    width: 100%;
    max-width: 480px;
    background: #fff;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .avatar {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .header-info h3 {
    font-size: 14px; font-weight: 600; color: var(--bot-text);
    line-height: 1.2;
  }
  .header-info p {
    font-size: 11px; color: #4CAF50; font-weight: 500;
  }
  .progress-wrap {
    display: flex; align-items: center; gap: 8px;
  }
  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--progress-bg);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
  }
  .progress-label {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    min-width: 32px;
    text-align: right;
  }

  /* Chat window */
  .chat {
    width: 100%;
    max-width: 480px;
    flex: 1;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 0;
    background: var(--chat-bg);
    min-height: calc(100vh - 64px);
    padding-bottom: 200px;
  }

  /* Messages */
  .msg-row {
    display: flex;
    margin-bottom: 4px;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.35s ease forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.bot { justify-content: flex-start; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.gap { margin-bottom: 14px; }

  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.55;
    word-break: break-word;
  }
  .bubble.bot {
    background: var(--bot-bubble);
    color: var(--bot-text);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
  }
  .bubble.user {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .bubble.typing {
    padding: 12px 16px;
    display: flex; gap: 4px; align-items: center;
  }
  .dot {
    width: 7px; height: 7px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  /* Input area */
  .input-area {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-width: 480px;
    background: var(--chat-bg);
    border-top: 1px solid var(--border);
    padding: 12px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
  }

  /* Option tags */
  .options-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .opt-btn {
    background: var(--tag-bg);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    color: var(--bot-text);
    transition: all 0.18s ease;
    font-weight: 500;
    line-height: 1.3;
    text-align: left;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .opt-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(45,91,227,0.15);
  }
  .opt-btn.selected {
    background: var(--tag-selected);
    color: var(--tag-selected-text);
    border-color: var(--tag-selected);
    box-shadow: 0 3px 10px rgba(45,91,227,0.25);
  }

  /* Confirm button for multi */
  .confirm-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
    display: none;
    box-shadow: 0 4px 14px rgba(45,91,227,0.3);
  }
  .confirm-btn.visible { display: block; }
  .confirm-btn:hover { opacity: 0.9; transform: translateY(-1px); }

  /* Text input */
  .text-wrap {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .text-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    resize: none;
    min-height: 42px;
    max-height: 100px;
    outline: none;
    transition: border-color 0.18s;
    background: #fff;
    color: var(--bot-text);
    line-height: 1.4;
  }
  .text-input:focus { border-color: var(--accent); }
  .send-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.18s;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(45,91,227,0.3);
  }
  .send-btn:hover { opacity: 0.9; transform: scale(1.05); }
  .send-btn svg { width: 18px; height: 18px; fill: white; }

  /* Scale */
  .scale-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .scale-nums {
    display: flex;
    gap: 4px;
    justify-content: space-between;
  }
  .scale-btn {
    flex: 1;
    background: var(--tag-bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 9px 0;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--bot-text);
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .scale-btn:hover { border-color: var(--accent); color: var(--accent); }
  .scale-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  .scale-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    padding: 0 2px;
  }

  /* End screen */
  .end-card {
    background: #fff;
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: var(--shadow);
    margin: 16px 0;
    animation: fadeUp 0.5s ease forwards;
  }
  .end-card .emoji { font-size: 48px; margin-bottom: 16px; display: block; }
  .end-card h2 { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--bot-text); margin-bottom: 8px; }
  .end-card p { font-size: 14px; color: var(--muted); line-height: 1.6; }

  .hidden { display: none !important; }
  .date-lbl {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin: 12px 0 16px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div class="avatar">🏠</div>
    <div class="header-info">
      <h3>MadeiraMadeira Serviços</h3>
      <p>● online agora</p>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0/12</div>
  </div>
</div>

<!-- Chat -->
<div class="chat" id="chat">
  <div class="date-lbl">Hoje</div>
</div>

<!-- Input area -->
<div class="input-area" id="inputArea">
  <div class="options-wrap hidden" id="optionsWrap"></div>
  <div class="confirm-btn hidden" id="confirmBtn" onclick="submitMulti()">Confirmar →</div>
  <div class="text-wrap hidden" id="textWrap">
    <textarea class="text-input" id="textInput" placeholder="Digite aqui..." rows="1"
      oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
    <button class="send-btn" onclick="submitText()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="scale-wrap hidden" id="scaleWrap"></div>
</div>

<script>
const TOTAL = 12;
let step = 0;
let answers = {};
let multiSelected = [];
let typing = false;

const questions = [
  // Intro
  {
    type: 'intro',
    messages: [
      "Oi! 👋 Que bom ter você aqui.",
      "Sou da MadeiraMadeira Serviços e estou fazendo uma pesquisa rápida com pessoas próximas pra entender melhor como as pessoas percebem a gente.",
      "São só 12 perguntas, prometo que é rápido! Suas respostas são anônimas e vão nos ajudar muito. Vamos lá? 🚀"
    ],
    action: { type: 'single', options: ['Vamos! 😊', 'Claro, pode começar'] }
  },
  // Q1
  {
    key: 'q1',
    messages: ["Você contratou algum serviço para casa nos últimos 12 meses? (montagem, elétrica, encanamento, limpeza, etc.)"],
    action: {
      type: 'single',
      options: ['Sim, mais de uma vez', 'Sim, uma vez', 'Não, mas posso precisar em breve', 'Não contratei']
    }
  },
  // Q2
  {
    key: 'q2',
    messages: ["Como você costuma buscar um profissional ou empresa quando precisa de um serviço para casa?"],
    action: {
      type: 'multi',
      options: ['Indicação de amigos ou família', 'Google', 'Aplicativos ou plataformas', 'Profissional que já conheço', 'WhatsApp / grupos de bairro', 'Loja onde comprei o produto', 'Outro']
    }
  },
  // Q3
  {
    key: 'q3',
    messages: ["Quando você pensa em contratar um serviço para casa, quais marcas, apps ou plataformas vêm primeiro à sua cabeça?", "Pode escrever livremente, qualquer coisa que vier à mente! 👇"],
    action: { type: 'text', placeholder: 'Ex: GetNinjas, indicação de alguém, Google...' }
  },
  // Q4
  {
    key: 'q4',
    messages: ["Você conhece a MadeiraMadeira?"],
    action: {
      type: 'single',
      options: ['Sim, conheço bem', 'Já ouvi falar', 'Não conheço']
    }
  },
  // Q5
  {
    key: 'q5',
    messages: ["E sabia que a MadeiraMadeira oferece serviços para casa, como montagem de móveis, instalação, elétrica e outros?"],
    action: {
      type: 'single',
      options: ['Sim, já sabia!', 'Ouvi falar, mas não sabia exatamente o que tinha', 'Não sabia disso 😮']
    }
  },
  // Q6
  {
    key: 'q6',
    messages: ["Qual das opções abaixo melhor descreve sua relação com MadeiraMadeira Serviços?"],
    action: {
      type: 'single',
      options: ['Nunca ouvi falar', 'Ouvi falar, mas nunca acessei', 'Acessei, mas nunca contratei', 'Já contratei e foi ótimo! ⭐', 'Já contratei e não foi lá muito bom']
    }
  },
  // Q7
  {
    key: 'q7',
    messages: ["O que mais te impediria (ou impediu) de contratar serviços pela MadeiraMadeira?", "Pode marcar mais de uma opção!"],
    action: {
      type: 'multi',
      options: ['Preço alto', 'Não confio em plataformas pra isso', 'Falta de informações claras', 'Não sabia que a MM oferecia serviços', 'Prefiro indicação de alguém que conheço', 'Dificuldade de encontrar no site/app', 'Nunca precisei', 'Outro']
    }
  },
  // Q8
  {
    key: 'q8',
    messages: ["O que mais aumentaria sua confiança para contratar? Escolha até 3 opções:"],
    action: {
      type: 'multi',
      max: 3,
      options: ['Avaliações de outros clientes', 'Garantia do serviço', 'Preço fechado antes de contratar', 'Foto e perfil do profissional', 'Suporte em caso de problema', 'Indicação durante a compra de um móvel', 'Cupom de desconto na 1ª contratação', 'Outro']
    }
  },
  // Q9
  {
    key: 'q9',
    messages: ["Como você imagina que sejam os preços da MadeiraMadeira Serviços em relação ao mercado?"],
    action: {
      type: 'single',
      options: ['Bem mais caros', 'Um pouco mais caros', 'Na média do mercado', 'Um pouco mais baratos', 'Não sei dizer']
    }
  },
  // Q10
  {
    key: 'q10',
    messages: ["Em uma escala de 0 a 10, qual a chance de você considerar a MadeiraMadeira Serviços quando precisar de um serviço para casa?"],
    action: { type: 'scale', min: 0, max: 10, label0: 'Nenhuma chance', label10: 'Com certeza' }
  },
  // Q11
  {
    key: 'q11',
    messages: ["Quase lá! ✨ Qual é a sua faixa etária?"],
    action: {
      type: 'single',
      options: ['18 a 24 anos', '25 a 34 anos', '35 a 44 anos', '45 a 54 anos', '55 anos ou mais']
    }
  },
  // Q12
  {
    key: 'q12',
    messages: ["Última! Qual é o seu tipo de moradia?"],
    action: {
      type: 'single',
      options: ['Casa própria', 'Casa alugada', 'Apartamento próprio', 'Apartamento alugado', 'Outro']
    }
  }
];

const chat = document.getElementById('chat');
const inputArea = document.getElementById('inputArea');

function scrollDown() {
  setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 60);
}

function addBubble(text, side, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const row = document.createElement('div');
      row.className = `msg-row ${side} gap`;
      const bubble = document.createElement('div');
      bubble.className = `bubble ${side}`;
      bubble.textContent = text;
      row.appendChild(bubble);
      chat.appendChild(row);
      scrollDown();
      resolve();
    }, delay);
  });
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingIndicator';
  const bubble = document.createElement('div');
  bubble.className = 'bubble bot typing';
  bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollDown();
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendBotMessages(messages, delay = 700) {
  showTyping();
  await new Promise(r => setTimeout(r, delay));
  removeTyping();
  for (let i = 0; i < messages.length; i++) {
    await addBubble(messages[i], 'bot', i === 0 ? 0 : 300);
    if (i < messages.length - 1) {
      await new Promise(r => setTimeout(r, 350));
      if (i < messages.length - 2) { showTyping(); await new Promise(r => setTimeout(r, 500)); removeTyping(); }
    }
  }
}

function updateProgress() {
  const pct = step === 0 ? 0 : Math.round((step / TOTAL) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = step + '/' + TOTAL;
}

function showOptions(q) {
  const wrap = document.getElementById('optionsWrap');
  const confirm = document.getElementById('confirmBtn');
  const textWrap = document.getElementById('textWrap');
  const scaleWrap = document.getElementById('scaleWrap');
  wrap.innerHTML = '';
  wrap.classList.add('hidden');
  confirm.classList.add('hidden');
  confirm.classList.remove('visible');
  textWrap.classList.add('hidden');
  scaleWrap.classList.add('hidden');
  multiSelected = [];

  if (q.action.type === 'single') {
    wrap.classList.remove('hidden');
    q.action.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt;
      btn.onclick = () => selectSingle(opt, btn);
      wrap.appendChild(btn);
    });
  } else if (q.action.type === 'multi') {
    wrap.classList.remove('hidden');
    q.action.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt;
      btn.onclick = () => toggleMulti(opt, btn, q.action.max);
      wrap.appendChild(btn);
    });
    const cb = document.getElementById('confirmBtn');
    cb.classList.remove('hidden');
    cb.classList.add('visible');
    cb.style.display = 'none';
  } else if (q.action.type === 'text') {
    textWrap.classList.remove('hidden');
    const input = document.getElementById('textInput');
    input.value = '';
    input.placeholder = q.action.placeholder || 'Digite aqui...';
    setTimeout(() => input.focus(), 300);
  } else if (q.action.type === 'scale') {
    scaleWrap.classList.remove('hidden');
    const nums = document.createElement('div');
    nums.className = 'scale-nums';
    for (let i = q.action.min; i <= q.action.max; i++) {
      const btn = document.createElement('button');
      btn.className = 'scale-btn';
      btn.textContent = i;
      btn.onclick = () => selectScale(i, btn);
      nums.appendChild(btn);
    }
    const labels = document.createElement('div');
    labels.className = 'scale-labels';
    labels.innerHTML = `<span>${q.action.label0}</span><span>${q.action.label10}</span>`;
    scaleWrap.appendChild(nums);
    scaleWrap.appendChild(labels);
  }
}

function hideInput() {
  document.getElementById('optionsWrap').classList.add('hidden');
  document.getElementById('confirmBtn').classList.add('hidden');
  document.getElementById('confirmBtn').classList.remove('visible');
  document.getElementById('textWrap').classList.add('hidden');
  document.getElementById('scaleWrap').classList.add('hidden');
}

async function selectSingle(val, btn) {
  hideInput();
  await addBubble(val, 'user');
  if (questions[step].key) answers[questions[step].key] = val;
  step++;
  updateProgress();
  await nextStep();
}

function toggleMulti(val, btn, max) {
  const idx = multiSelected.indexOf(val);
  if (idx >= 0) {
    multiSelected.splice(idx, 1);
    btn.classList.remove('selected');
  } else {
    if (max && multiSelected.length >= max) return;
    multiSelected.push(val);
    btn.classList.add('selected');
  }
  const cb = document.getElementById('confirmBtn');
  if (multiSelected.length > 0) {
    cb.style.display = 'block';
    cb.textContent = `Confirmar (${multiSelected.length}) →`;
  } else {
    cb.style.display = 'none';
  }
}

async function submitMulti() {
  if (multiSelected.length === 0) return;
  const val = multiSelected.join(', ');
  hideInput();
  await addBubble(val, 'user');
  if (questions[step].key) answers[questions[step].key] = multiSelected;
  step++;
  updateProgress();
  await nextStep();
}

async function submitText() {
  const input = document.getElementById('textInput');
  const val = input.value.trim();
  if (!val) return;
  hideInput();
  await addBubble(val, 'user');
  if (questions[step].key) answers[questions[step].key] = val;
  step++;
  updateProgress();
  await nextStep();
}

async function selectScale(val, btn) {
  document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  await new Promise(r => setTimeout(r, 250));
  hideInput();
  await addBubble(val.toString(), 'user');
  if (questions[step].key) answers[questions[step].key] = val;
  step++;
  updateProgress();
  await nextStep();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitText(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

async function nextStep() {
  if (step >= questions.length) {
    await showEnd();
    return;
  }
  const q = questions[step];
  await sendBotMessages(q.messages, step === 0 ? 400 : 600);
  showOptions(q);
  scrollDown();
}

async function showEnd() {
  hideInput();
  await sendBotMessages(["Incrível! Isso foi tudo. 🎉", "Muito obrigada pela sua participação! As suas respostas vão nos ajudar a melhorar muito o MadeiraMadeira Serviços. 💙"], 600);
  const card = document.createElement('div');
  card.className = 'end-card';
  card.innerHTML = `
    <span class="emoji">🏠✨</span>
    <h2>Muito obrigada!</h2>
    <p>Sua opinião é super importante para a gente construir um serviço que realmente faz sentido para você e para a sua casa.</p>
  `;
  chat.appendChild(card);
  scrollDown();
}

// Start
window.onload = () => {
  updateProgress();
  nextStep();
};
</script>
</body>
</html>
