<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Pesquisa MadeiraMadeira Serviços</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:#FAF7F4;}

:root{
  --orange:#EA5B0C;
  --orange-light:#FEF0E7;
  --dark:#1A1A2E;
  --muted:#8A8A9A;
  --border:#EDE8E2;
  --white:#FFFFFF;
  --user-bg:#EA5B0C;
  --bot-bg:#FFFFFF;
  --shadow:0 2px 12px rgba(234,91,12,0.10);
}

/* ── Layout shell ── */
.shell{
  display:flex;flex-direction:column;
  height:100dvh;height:100vh;
  max-width:480px;margin:0 auto;
  background:#FAF7F4;
  position:relative;
}

/* ── Header ── */
.hdr{
  flex-shrink:0;
  background:#fff;
  border-bottom:3px solid var(--orange);
  padding:12px 16px 10px;
  box-shadow:var(--shadow);
  z-index:20;
}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.hdr-logo{height:30px;width:auto;border-radius:6px;display:block;}
.hdr-status{font-size:11px;color:#4CAF50;font-weight:600;margin-left:auto;}
.prog-wrap{display:flex;align-items:center;gap:8px;}
.prog-bar{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:var(--orange);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);width:0%;}
.prog-lbl{font-size:11px;color:var(--muted);white-space:nowrap;min-width:36px;text-align:right;font-weight:600;}

/* ── Chat area ── */
.chat{
  flex:1;overflow-y:auto;
  padding:16px 14px 12px;
  display:flex;flex-direction:column;gap:0;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
.date-lbl{text-align:center;font-size:11px;color:var(--muted);margin:4px 0 14px;}

/* ── Bubbles ── */
.row{display:flex;margin-bottom:3px;opacity:0;transform:translateY(8px);animation:up .3s ease forwards;}
.row.bot{justify-content:flex-start;}
.row.user{justify-content:flex-end;}
.row.gap{margin-bottom:12px;}
@keyframes up{to{opacity:1;transform:translateY(0);}}
.bbl{
  max-width:82%;padding:10px 14px;
  font-size:14px;line-height:1.55;word-break:break-word;
  border-radius:18px;
}
.bbl.bot{background:var(--bot-bg);color:var(--dark);border-bottom-left-radius:4px;box-shadow:var(--shadow);}
.bbl.user{background:var(--user-bg);color:#fff;border-bottom-right-radius:4px;}
.bbl.typing{padding:12px 16px;display:flex;gap:4px;align-items:center;}
.dot{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:bounce 1.2s infinite;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}

/* ── Input area ── */
.inp{
  flex-shrink:0;
  background:#FAF7F4;
  border-top:1px solid var(--border);
  padding:10px 14px 14px;
  display:flex;flex-direction:column;gap:8px;
  z-index:10;
  padding-bottom:max(14px, env(safe-area-inset-bottom));
}
.opts{display:flex;flex-wrap:wrap;gap:7px;}
.opt{
  background:#fff;border:1.5px solid var(--border);border-radius:12px;
  padding:8px 13px;font-size:13px;font-family:'Nunito',sans-serif;
  cursor:pointer;color:var(--dark);font-weight:600;line-height:1.3;
  text-align:left;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:all .15s;
}
.opt:hover{border-color:var(--orange);color:var(--orange);transform:translateY(-1px);}
.opt.sel{background:var(--orange);color:#fff;border-color:var(--orange);box-shadow:0 3px 10px rgba(234,91,12,.25);}
.cfm{
  background:var(--orange);color:#fff;border:none;border-radius:10px;
  padding:11px 20px;font-size:14px;font-family:'Nunito',sans-serif;font-weight:700;
  cursor:pointer;transition:all .15s;box-shadow:0 4px 14px rgba(234,91,12,.3);display:none;
}
.cfm:hover{opacity:.9;transform:translateY(-1px);}
.txt-wrap{display:flex;gap:8px;align-items:flex-end;}
.txt-in{
  flex:1;border:1.5px solid var(--border);border-radius:16px;
  padding:10px 14px;font-size:14px;font-family:'Nunito',sans-serif;
  resize:none;min-height:42px;max-height:90px;outline:none;
  background:#fff;color:var(--dark);line-height:1.4;transition:border-color .15s;
}
.txt-in:focus{border-color:var(--orange);}
.send{
  width:42px;height:42px;border-radius:50%;background:var(--orange);border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;box-shadow:0 4px 12px rgba(234,91,12,.3);transition:all .15s;
}
.send:hover{opacity:.9;transform:scale(1.05);}
.send svg{width:18px;height:18px;fill:#fff;}
.scl{display:flex;flex-direction:column;gap:5px;}
.scl-nums{display:flex;gap:3px;}
.scl-btn{
  flex:1;background:#fff;border:1.5px solid var(--border);border-radius:8px;
  padding:8px 0;font-size:13px;font-weight:700;cursor:pointer;color:var(--dark);
  font-family:'Nunito',sans-serif;transition:all .13s;
}
.scl-btn:hover{border-color:var(--orange);color:var(--orange);}
.scl-btn.sel{background:var(--orange);color:#fff;border-color:var(--orange);}
.scl-lbls{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:0 2px;}

/* ── End card ── */
.end-card{
  background:#fff;border-radius:20px;padding:28px 22px;text-align:center;
  box-shadow:var(--shadow);margin:12px 0;animation:up .5s ease forwards;
}
.end-card .ico{font-size:44px;margin-bottom:14px;display:block;}
.end-card h2{font-size:20px;font-weight:800;color:var(--dark);margin-bottom:8px;}
.end-card p{font-size:13px;color:var(--muted);line-height:1.6;}

.hidden{display:none!important;}
</style>
</head>

  // Q12 — percepção de preço
  {key:'q12', msgs:["Como você imagina que sejam os preços da MadeiraMadeira Serviços em relação ao mercado?"],
    action:{type:'single', opts:['Bem mais caros','Um pouco mais caros','Na média do mercado','Um pouco mais baratos','Não sei dizer']}
  },
  // Q13 — intenção
  {key:'q13', msgs:["Em uma escala de 0 a 10, qual a chance de você considerar a MadeiraMadeira Serviços na próxima vez que precisar de algo para casa?"],
    action:{type:'scale', min:0, max:10, l0:'Nenhuma chance', l10:'Com certeza'}
  },
  // Q14 — faixa etária
  {key:'q14', msgs:["Quase lá! ✨ Qual é a sua faixa etária?"],
    action:{type:'single', opts:['18 a 24 anos','25 a 34 anos','35 a 44 anos','45 a 54 anos','55 anos ou mais']}
  },
  // Q15 — estado
  {key:'q15', msgs:["Última pergunta: em qual estado você mora?"],
    action:{type:'single', opts:[
      'SP — São Paulo','RJ — Rio de Janeiro','PR — Paraná','RS — Rio Grande do Sul',
      'MG — Minas Gerais','SC — Santa Catarina','BA — Bahia','GO — Goiás',
      'PE — Pernambuco','CE — Ceará','DF — Distrito Federal','ES — Espírito Santo',
      'PA — Pará','MT — Mato Grosso','MS — Mato Grosso do Sul','RN — Rio Grande do Norte',
      'PB — Paraíba','MA — Maranhão','AM — Amazonas','AL — Alagoas',
      'PI — Piauí','SE — Sergipe','RO — Rondônia','TO — Tocantins',
      'AC — Acre','AP — Amapá','RR — Roraima'
    ]}
  }
];

const chat=document.getElementById('chat');

function scrollDown(){requestAnimationFrame(()=>{chat.scrollTop=chat.scrollHeight;});}

function addBubble(text,side,delay=0){
  return new Promise(r=>{
    setTimeout(()=>{
      const row=document.createElement('div');
      row.className=`row ${side} gap`;
      const b=document.createElement('div');
      b.className=`bbl ${side}`;
      b.textContent=text;
      row.appendChild(b);
      chat.appendChild(row);
      scrollDown();
      r();
    },delay);
  });
}

function showTyping(){
  const row=document.createElement('div');row.className='row bot';row.id='typ';
  const b=document.createElement('div');b.className='bbl bot typing';
  b.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  row.appendChild(b);chat.appendChild(row);scrollDown();
}
function rmTyping(){const e=document.getElementById('typ');if(e)e.remove();}

async function botSay(msgs, delay=700){
  showTyping();
  await wait(delay);
  rmTyping();
  for(let i=0;i<msgs.length;i++){
    await addBubble(msgs[i],'bot',0);
    if(i<msgs.length-1){
      await wait(260);
      if(i<msgs.length-2){showTyping();await wait(480);rmTyping();}
    }
  }
}

function wait(ms){return new Promise(r=>setTimeout(r,ms));}

function updProg(){
  const pct=step===0?0:Math.round((step/TOTAL)*100);
  document.getElementById('pFill').style.width=pct+'%';
  document.getElementById('pLbl').textContent=step+'/'+TOTAL;
}

function hideInput(){
  document.getElementById('opts').classList.add('hidden');
  const cfm=document.getElementById('cfm');cfm.classList.add('hidden');cfm.style.display='none';
  document.getElementById('txtWrap').classList.add('hidden');
  document.getElementById('scl').classList.add('hidden');
}

function showInput(q){
  hideInput();multi=[];
  const {type,opts,max,ph,min,l0,l10}=q.action;
  if(type==='single'){
    const wrap=document.getElementById('opts');
    wrap.innerHTML='';wrap.classList.remove('hidden');
    opts.forEach(o=>{
      const b=document.createElement('button');b.className='opt';b.textContent=o;
      b.onclick=()=>pickSingle(o,b);wrap.appendChild(b);
    });
  } else if(type==='multi'){
    const wrap=document.getElementById('opts');
    wrap.innerHTML='';wrap.classList.remove('hidden');
    opts.forEach(o=>{
      const b=document.createElement('button');b.className='opt';b.textContent=o;
      b.onclick=()=>toggleMulti(o,b,max);wrap.appendChild(b);
    });
    const cfm=document.getElementById('cfm');cfm.classList.remove('hidden');cfm.style.display='none';
  } else if(type==='text'){
    const tw=document.getElementById('txtWrap');tw.classList.remove('hidden');
    const inp=document.getElementById('txtIn');
    inp.value='';inp.placeholder=ph||'Digite aqui...';
    inp.dataset.outro='';inp.dataset.outroKey='';
    setTimeout(()=>inp.focus(),300);
  } else if(type==='scale'){
    const sw=document.getElementById('scl');sw.innerHTML='';sw.classList.remove('hidden');
    const nums=document.createElement('div');nums.className='scl-nums';
    for(let i=min;i<=max;i++){
      const b=document.createElement('button');b.className='scl-btn';b.textContent=i;
      b.onclick=()=>pickScale(i,b);nums.appendChild(b);
    }
    const lbls=document.createElement('div');lbls.className='scl-lbls';
    lbls.innerHTML=`<span>${l0}</span><span>${l10}</span>`;
    sw.appendChild(nums);sw.appendChild(lbls);
  }
  scrollDown();
}

async function askOutro(key){
  await botSay(["Pode especificar? 😊"],350);
  const tw=document.getElementById('txtWrap');tw.classList.remove('hidden');
  const inp=document.getElementById('txtIn');
  inp.value='';inp.placeholder='Conta pra gente...';
  inp.dataset.outro='1';inp.dataset.outroKey=key;
  setTimeout(()=>inp.focus(),300);
}

async function pickSingle(val,btn){
  hideInput();
  await addBubble(val,'user');
  const key=qs[step].key;
  if(key) answers[key]=val;
  step++;updProg();
  if(val==='Outro') await askOutro(key);
  else await nextStep();
}

function toggleMulti(val,btn,max){
  const idx=multi.indexOf(val);
  if(idx>=0){multi.splice(idx,1);btn.classList.remove('sel');}
  else{
    if(max&&multi.length>=max) return;
    multi.push(val);btn.classList.add('sel');
  }
  const cfm=document.getElementById('cfm');
  cfm.style.display=multi.length>0?'block':'none';
  cfm.textContent=multi.length>0?`Confirmar (${multi.length}) →`:'Confirmar →';
}

async function submitMulti(){
  if(!multi.length) return;
  const val=multi.join(', ');
  hideInput();
  await addBubble(val,'user');
  const key=qs[step].key;
  if(key) answers[key]=[...multi];
  step++;updProg();
  if(multi.includes('Outro')) await askOutro(key);
  else await nextStep();
}

async function submitText(){
  const inp=document.getElementById('txtIn');
  const val=inp.value.trim();if(!val) return;
  const isOutro=inp.dataset.outro==='1';
  const outroKey=inp.dataset.outroKey;
  inp.dataset.outro='';inp.dataset.outroKey='';
  hideInput();
  await addBubble(val,'user');
  if(isOutro){
    if(Array.isArray(answers[outroKey]))
      answers[outroKey]=answers[outroKey].map(v=>v==='Outro'?'Outro: '+val:v);
    else if(answers[outroKey]==='Outro')
      answers[outroKey]='Outro: '+val;
    await nextStep();
  } else {
    if(qs[step].key) answers[qs[step].key]=val;
    step++;updProg();
    await nextStep();
  }
}

async function pickScale(val,btn){
  document.querySelectorAll('.scl-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  await wait(220);hideInput();
  await addBubble(val.toString(),'user');
  if(qs[step].key) answers[qs[step].key]=val;
  step++;updProg();
  await nextStep();
}

function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitText();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,90)+'px';}

async function nextStep(){
  if(step>=qs.length){await showEnd();return;}
  const q=qs[step];
  await botSay(q.msgs, step===0?350:550);
  showInput(q);
}

async function saveAnswers(){
  try{
    await fetch(APPS_SCRIPT_URL,{
      method:'POST',mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({timestamp:new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}),...answers})
    });
  } catch(e){console.warn(e);}
}

async function showEnd(){
  hideInput();
  await saveAnswers();
  await botSay(["Incrível! Isso foi tudo. 🎉","Muito obrigada pela sua participação! Vai nos ajudar demais a melhorar o MadeiraMadeira Serviços. 💙"],600);
  const card=document.createElement('div');card.className='end-card';
  card.innerHTML=`<span class="ico">🏠</span><h2>Muito obrigada!</h2><p>Sua opinião é super importante pra gente construir algo que realmente faz sentido para você e para a sua casa.</p>`;
  chat.appendChild(card);scrollDown();
}

window.onload=()=>{updProg();nextStep();};
</script>
